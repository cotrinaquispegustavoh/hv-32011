<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}I.E. 32011 Hermilio Valdizán — Huánuco{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
    <script>
        tailwind.config = {
            theme: { extend: { colors: { hv: { dark: '#111827', blue: '#2563EB', gray: '#F3F4F6' } } } }
        }
    </script>
</head>
<body id="inicio" class="bg-slate-50 text-slate-900 antialiased overflow-x-hidden flex flex-col min-h-screen">

    <header class="fixed w-full top-0 z-50 bg-white/80 backdrop-blur-md border-b border-slate-100 transition-all">
        <div class="container mx-auto px-6 h-20 flex items-center justify-between">
            
            <a href="{% url 'core:home' %}" class="flex items-center gap-3 group overflow-visible">
                <!-- Reemplazo temporal del logo por un icono elegante -->
                <div class="w-11 h-11 bg-sky-600 text-white rounded-xl flex items-center justify-center shadow-md shadow-sky-200 group-hover:scale-105 transition-transform duration-300">
                    <i class="fa-solid fa-graduation-cap text-xl"></i>
                </div>
                <div class="flex flex-col">
                    <span class="font-black text-lg tracking-tight leading-none text-slate-800">I.E. 32011</span>
                    <span class="text-[10px] font-black text-sky-600 uppercase tracking-widest mt-0.5">Huánuco</span>
                </div>
            </a>

            <nav class="hidden md:flex items-center gap-8 text-xs font-black text-slate-500 uppercase tracking-widest">
                <a href="#inicio" class="hover:text-sky-600 transition-colors">Inicio</a>
                <a href="#identidad" class="hover:text-sky-600 transition-colors">Identidad</a>
                <a href="#agenda" class="hover:text-sky-600 transition-colors">Agenda</a>
            </nav>

            <div class="flex items-center gap-6">
                <a href="{% url 'users:login' %}" class="bg-slate-900 hover:bg-sky-700 text-white px-6 py-3 rounded-full font-black text-xs uppercase tracking-wider transition-all shadow-lg shadow-slate-900/10 active:scale-95">
                    Intranet
                </a>
            </div>
        </div>
    </header>
    <div class="h-20"></div>

    <main class="flex-grow">
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-white py-8 border-t border-slate-100 mt-auto">
        <div class="container mx-auto px-6 flex flex-col md:flex-row justify-between items-center gap-4 text-[10px] font-black text-slate-400 uppercase tracking-[0.2em]">
            <div class="text-slate-400 font-black">I.E. 32011 Hermilio Valdizán — Huánuco</div>
            <div class="text-slate-500">&copy; 2026 Intranet_HV</div>
        </div>
    </footer>
</body>
</html>
