{% extends 'base.html' %}

{% block header_title %}Catálogo de Materiales{% endblock %}

{% block content %}
<div class="max-w-7xl mx-auto w-full animate-in fade-in duration-500">
    
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-8 gap-4">
        <div>
            <h1 class="text-2xl font-black text-blue-900 uppercase tracking-wide">Catálogo de Materiales</h1>
            <p class="text-sm font-medium text-gray-500 mt-1">Consulta y reserva de recursos didácticos en tiempo real.</p>
        </div>
    </div>

    <!-- BUSCADOR Y FILTROS (Solución Punto 7) -->
    <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-200 mb-8 flex flex-col sm:flex-row gap-4">
        <div class="relative flex-grow">
            <i class="fa-solid fa-magnifying-glass absolute left-4 top-3.5 text-gray-400"></i>
            <input type="text" name="q" 
                   hx-get="{% url 'warehouse:catalog' %}" 
                   hx-trigger="keyup changed delay:300ms, search" 
                   hx-target="#grid-materiales" 
                   hx-include="[name='cycle'], [name='category']"
                   placeholder="Buscar material por nombre o ubicación..." 
                   class="w-full pl-10 pr-4 py-2.5 border border-gray-200 rounded-lg text-sm font-medium text-gray-800 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-shadow">
        </div>
        
        <select name="category" 
                hx-get="{% url 'warehouse:catalog' %}" 
                hx-trigger="change" 
                hx-target="#grid-materiales" 
                hx-include="[name='q'], [name='cycle']"
                class="w-full sm:w-48 px-4 py-2.5 border border-gray-200 rounded-lg text-sm font-bold text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white cursor-pointer transition-shadow">
            <option value="">Todas las Categorías</option>
            {% for cat in categories %}
                <option value="{{ cat }}">{{ cat }}</option>
            {% endfor %}
        </select>

        <select name="cycle" 
                hx-get="{% url 'warehouse:catalog' %}" 
                hx-trigger="change" 
                hx-target="#grid-materiales" 
                hx-include="[name='q'], [name='category']"
                class="w-full sm:w-48 px-4 py-2.5 border border-gray-200 rounded-lg text-sm font-bold text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white cursor-pointer transition-shadow">
            <option value="">Todos los Ciclos</option>
            <option value="III">Ciclo III (1ro y 2do)</option>
            <option value="IV">Ciclo IV (3ro y 4to)</option>
            <option value="V">Ciclo V (5to y 6to)</option>
        </select>
    </div>

    <!-- GRID DE MATERIALES -->
    <div id="grid-materiales" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"
         hx-get="{% url 'warehouse:catalog' %}"
         hx-trigger="actualizarCatalogo from:body">
        {% include 'warehouse/partials/catalog_cards.html' %}
    </div>
</div>

<script>
    document.addEventListener('alpine:init', () => {
        Alpine.data('loanModal', (maxStock) => ({
            open: false,
            step: 1,
            quantity: 1,
            maxStock: maxStock,
            date: new Date().toISOString().split('T')[0],
            today: new Date().toISOString().split('T')[0],
            interval: null,
            
            hours: ['01','02','03','04','05','06','07','08','09','10','11','12'],
            minutes: ['00','05','10','15','20','25','30','35','40','45','50','55'],
            
            p_hour: '', p_min: '', p_ampm: 'AM',
            r_hour: '', r_min: '', r_ampm: 'AM',

            startIncrease() {
                if(this.quantity < this.maxStock) this.quantity++;
                this.interval = setInterval(() => { if(this.quantity < this.maxStock) this.quantity++; }, 150);
            },
            startDecrease() {
                if(this.quantity > 1) this.quantity--;
                this.interval = setInterval(() => { if(this.quantity > 1) this.quantity--; }, 150);
            },
            stopAction() { clearInterval(this.interval); },

            formatToISO(hour12, min, ampm) {
                if(!this.date || !hour12 || !min) return '';
                let h = parseInt(hour12);
                if(ampm === 'PM' && h < 12) h += 12;
                if(ampm === 'AM' && h === 12) h = 0;
                let hStr = h.toString().padStart(2, '0');
                return `${this.date}T${hStr}:${min}`;
            },

            getPickupDatetime() { return this.formatToISO(this.p_hour, this.p_min, this.p_ampm); },
            getReturnDatetime() { return this.formatToISO(this.r_hour, this.r_min, this.r_ampm); },

            hasTimeError() {
                if(!this.date || !this.p_hour || !this.p_min || !this.r_hour || !this.r_min) return true;
                const pickup = new Date(this.getPickupDatetime());
                const ret = new Date(this.getReturnDatetime());
                return ret <= pickup;
            }
        }))
    });

    // --- SOLUCIÓN PUNTO 10: Escuchar WebSockets para actualizar stock sin recargar ---
    document.addEventListener('DOMContentLoaded', function() {
        const protocol = window.location.protocol === 'https:' ? 'wss://' : 'ws://';
        const wsUrl = protocol + window.location.host + '/ws/notificaciones/';
        const socket = new WebSocket(wsUrl);

        socket.onmessage = function(e) {
            const data = JSON.parse(e.data);
            if (data.type === 'stock_update') {
                // Disparamos el evento de HTMX para que recargue el grid de materiales
                htmx.trigger('#grid-materiales', 'actualizarCatalogo');
            }
        };
    });
</script>
{% endblock %}
